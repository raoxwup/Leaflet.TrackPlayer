<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TrackPlayer performance and compatibility</title>
    <style>
      body {
        font: 15px sans-serif;
        margin: 16px;
      }
      button {
        padding: 8px;
        margin: 4px;
      }
      #map {
        height: 460px;
        background: #e8edf0;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>TrackPlayer: 10,000 synthetic points, 120 frames</h1>
    <p>
      Both versions use the same per-frame popup callback. No application code
      is optimized.
    </p>
    <button id="baseline">Original 2.0.4</button>
    <button id="optimized">Optimized</button>
    <button id="compatibility">Check compatibility</button>
    <div id="map"></div>
    <pre id="report">Ready</pre>
    <script type="module">
      import L from "leaflet";
      import "leaflet/dist/leaflet.css";
      import "./baseline.local.js";
      const Original = L.TrackPlayer;
      await import("../../dist/leaflet-trackplayer.js");
      const Optimized = L.TrackPlayer;
      const map = L.map("map", {
        zoomControl: false,
        attributionControl: false,
      });
      const coordinates = Array.from({ length: 10000 }, (_, i) => [
        30 + i * 0.000001,
        114 + Math.sin(i / 100) * 0.001,
      ]);
      map.fitBounds(coordinates);
      const report = document.querySelector("#report");
      const results = [];
      let busy = false;

      async function measure(Player, name) {
        if (busy) return;
        busy = true;
        report.textContent = "Running " + name;
        const player = new Player(coordinates, {
          panTo: false,
          markerRotation: false,
        }).addTo(map);
        player.isPaused = false;
        const stats = {
          name,
          frames: 0,
          cpuMs: 0,
          arrowRebuilds: 0,
          popupWrites: 0,
        };
        const setPaths = player.polylineDecorator.setPaths;
        player.polylineDecorator.setPaths = function (path) {
          stats.arrowRebuilds++;
          return setPaths.call(this, path);
        };
        const popup = L.popup({ autoPan: false, closeButton: false });
        player.on("progress", (progress, position, index) => {
          // Intentionally retain the application's original expensive callback.
          popup
            .setLatLng(position)
            .setContent(
              `<b>Record ${index}</b><br>` +
                Array.from({ length: 8 }, (_, i) => `Sensor ${i}: 20.5`).join(
                  "<br>"
                )
            )
            .openOn(map);
          stats.popupWrites++;
        });
        const intervals = [];
        let previous;
        await new Promise((resolve) => {
          const frame = (time) => {
            if (previous !== undefined) intervals.push(time - previous);
            previous = time;
            const start = performance.now();
            player.walkedDistance =
              player.distance * (0.25 + stats.frames * 0.000001);
            player.playAction();
            stats.cpuMs += performance.now() - start;
            stats.frames++;
            if (stats.frames < 120) requestAnimationFrame(frame);
            else resolve();
          };
          requestAnimationFrame(frame);
        });
        player.isPaused = true;
        player.remove();
        popup.remove();
        stats.cpuMs = +stats.cpuMs.toFixed(2);
        intervals.sort((a, b) => a - b);
        stats.p95FrameMs =
          +intervals[Math.floor(intervals.length * 0.95)].toFixed(2);
        results.push(stats);
        report.textContent = JSON.stringify(results, null, 2);
        busy = false;
      }

      document.querySelector("#baseline").onclick = () =>
        measure(Original, "original");
      document.querySelector("#optimized").onclick = () =>
        measure(Optimized, "optimized");
      document.querySelector("#compatibility").onclick = async () => {
        if (busy) return;
        busy = true;
        const checks = [];
        let player;
        const check = (condition, name) => {
          if (!condition) throw new Error(name);
          checks.push(name);
        };
        try {
          // Leaflet retains a shared renderer after the last polyline is removed.
          L.polyline([
            [30, 114],
            [30.001, 114.001],
          ])
            .addTo(map)
            .remove();
          const layerCount = () => {
            let count = 0;
            map.eachLayer(() => count++);
            return count;
          };
          const initialLayers = layerCount();
          player = new Optimized(
            [
              [30, 114],
              [30.001, 114.001],
              [30.002, 114.002],
            ],
            {
              panTo: false,
              markerIcon: L.divIcon({ html: "▲", className: "test-car" }),
            }
          ).addTo(map);
          let events = 0;
          player.on("progress", () => events++);
          player.setProgress(0.75);
          check(
            Math.abs(player.options.progress - 0.75) < 1e-8,
            "seek forward"
          );
          player.setProgress(0.25);
          check(
            Math.abs(player.options.progress - 0.25) < 1e-8,
            "seek backward"
          );
          player.setProgress(1);
          check(player.finished && player.trackIndex === 2, "finish");
          player.start();
          await new Promise((resolve) =>
            requestAnimationFrame(() => requestAnimationFrame(resolve))
          );
          check(!player.finished && player.options.progress < 1, "replay");
          player.pause();
          check(player.isPaused, "pause");
          await player.setSpeed(900, 0);
          check(player.options.speed === 900, "change speed");
          player.setProgress(0);
          check(player.options.progress === 0, "reset progress");
          check(events > 3, "progress events");
          check(
            !player.marker.getElement().style.transform.includes("NaN"),
            "valid rotation"
          );
          player.remove();
          check(layerCount() === initialLayers, "layer cleanup");
          player = new Optimized(
            [
              [30, 114],
              [30, 114],
            ],
            { panTo: false }
          ).addTo(map);
          player.setProgress(0.5);
          check(
            player.options.progress === 1 &&
              player.markerPoint.every(Number.isFinite),
            "coincident points"
          );
          player.remove();
          report.textContent = JSON.stringify(
            { passed: checks.length, checks },
            null,
            2
          );
        } catch (error) {
          player?.remove();
          report.textContent = "FAILED: " + error.stack;
        }
        busy = false;
      };
    </script>
  </body>
</html>
